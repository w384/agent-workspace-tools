identity:
  author: "tianh"
  name: "list_files"
  label:
    en_US: "List workspace files"
    zh_Hans: "列出工作区文件"
description:
  human:
    en_US: "List files in the configured local workspace."
    zh_Hans: "分页列出已配置本地工作区中的文件。"
  llm: "分页列出本地工作区中的文件及其元数据。"
parameters:
  - name: page
    type: number
    required: false
    default: 1
    min: 1
    label:
      en_US: "Page"
      zh_Hans: "页码"
    human_description:
      en_US: "Page number, starting from 1."
      zh_Hans: "页码，从 1 开始。"
    llm_description: "页码，从 1 开始。"
    form: llm
  - name: page_size
    type: number
    required: false
    default: 10
    min: 1
    max: 10
    label:
      en_US: "Page size"
      zh_Hans: "每页数量"
    human_description:
      en_US: "Number of files per page, from 1 to 10."
      zh_Hans: "每页文件数，范围为 1 到 10。"
    llm_description: "每页文件数，最大为 10。"
    form: llm
output_schema:
  type: object
  properties:
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
    has_more:
      type: boolean
    items:
      type: array
      items:
        type: object
        properties:
          path:
            type: string
          name:
            type: string
          extension:
            type: string
          size_bytes:
            type: integer
          modified_at:
            type: string
        required: [path, name, extension, size_bytes, modified_at]
  required: [total, page, page_size, has_more, items]
extra:
  python:
    source: tools/list_files.py
