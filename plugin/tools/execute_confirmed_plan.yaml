identity:
  author: "tianh"
  name: "execute_confirmed_plan"
  label:
    en_US: "Execute confirmed plan"
    zh_Hans: "执行已确认计划"
description:
  human:
    en_US: "Issue a one-time approval token and execute a human-confirmed plan."
    zh_Hans: "为已经人工确认的计划签发一次性令牌并执行。"
  llm: "仅在 Human Input 批准分支调用；输入只有计划编号。"
parameters:
  - name: plan_id
    type: string
    required: true
    label:
      en_US: "Plan ID"
      zh_Hans: "计划编号"
    human_description:
      en_US: "The identifier returned by create_plan."
      zh_Hans: "create_plan 返回的计划编号。"
    llm_description: "等待人工确认的计划编号。"
    form: llm
output_schema:
  type: object
  properties:
    plan_id:
      type: string
    status:
      type: string
    file_count:
      type: integer
    operation_id:
      type: string
  required: [plan_id, status, file_count, operation_id]
extra:
  python:
    source: tools/execute_confirmed_plan.py
