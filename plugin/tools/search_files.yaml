identity:
  author: "tianh"
  name: "search_files"
  label:
    en_US: "Search workspace files"
    zh_Hans: "搜索工作区文件"
description:
  human:
    en_US: "Search files by name in the configured local workspace."
    zh_Hans: "按名称搜索已配置本地工作区中的文件。"
  llm: "按文件名搜索本地工作区，并返回匹配文件及其元数据。"
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: "Query"
      zh_Hans: "搜索词"
    human_description:
      en_US: "Non-empty file name search text."
      zh_Hans: "不能为空的文件名搜索词。"
    llm_description: "文件名搜索词，不能为空或只包含空白。"
    form: llm
  - name: page
    type: number
    required: false
    default: 1
    min: 1
    label:
      en_US: "Page"
      zh_Hans: "页码"
    human_description:
      en_US: "Page number, starting from 1."
      zh_Hans: "页码，从 1 开始。"
    llm_description: "页码，从 1 开始。"
    form: llm
  - name: page_size
    type: number
    required: false
    default: 10
    min: 1
    max: 10
    label:
      en_US: "Page size"
      zh_Hans: "每页数量"
    human_description:
      en_US: "Number of files per page, from 1 to 10."
      zh_Hans: "每页文件数，范围为 1 到 10。"
    llm_description: "每页文件数，最大为 10。"
    form: llm
output_schema:
  type: object
  properties:
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
    has_more:
      type: boolean
    items:
      type: array
      items:
        type: object
        properties:
          path:
            type: string
          name:
            type: string
          extension:
            type: string
          size_bytes:
            type: integer
          modified_at:
            type: string
        required: [path, name, extension, size_bytes, modified_at]
  required: [total, page, page_size, has_more, items]
extra:
  python:
    source: tools/search_files.py
