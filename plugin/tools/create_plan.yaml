identity:
  author: "tianh"
  name: "create_plan"
  label:
    en_US: "Create workspace plan"
    zh_Hans: "创建工作区计划"
description:
  human:
    en_US: "Validate operations and create a plan for human confirmation."
    zh_Hans: "校验操作并创建等待人工确认的工作区计划。"
  llm: "根据非空 JSON 操作数组创建计划；此工具不会执行文件操作。"
parameters:
  - name: operations_json
    type: string
    required: true
    label:
      en_US: "Operations JSON"
      zh_Hans: "操作 JSON"
    human_description:
      en_US: "A non-empty JSON array of workspace operations."
      zh_Hans: "非空的工作区操作 JSON 数组。"
    llm_description: "非空 JSON 数组；仅创建计划，不执行操作。"
    form: llm
output_schema:
  type: object
  properties:
    plan_id:
      type: string
    status:
      type: string
    file_count:
      type: integer
    confirmation_text:
      type: string
    confirmation_json:
      type: object
      properties:
        folders_to_create:
          type: array
          items:
            type: string
        moves:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              destination:
                type: string
            required: [source, destination]
        renames:
          type: array
          items:
            type: object
            properties:
              source_name:
                type: string
              destination_name:
                type: string
            required: [source_name, destination_name]
        trash:
          type: array
          items:
            type: string
      required: [folders_to_create, moves, renames, trash]
  required: [plan_id, status, file_count, confirmation_text, confirmation_json]
extra:
  python:
    source: tools/create_plan.py
